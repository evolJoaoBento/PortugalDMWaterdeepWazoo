<body>
<div id="bar">
  <button id="open-map" type="button">Load a map&hellip;</button>
  <span class="rule"></span>
  <button id="a-reveal" type="button" class="on">Reveal</button>
  <button id="a-hide" type="button">Hide</button>
  <span class="rule"></span>
  <button id="all-reveal" type="button">Reveal all</button>
  <button id="all-fog" type="button">Fog all</button>
  <button id="rotate" type="button">Rotate</button>
  <button id="undo" type="button">Undo</button>
  <button id="redo" type="button">Redo</button>
  <span class="rule"></span>
  <button id="open-screen" type="button">Open the players&rsquo; screen</button>

</div>
<canvas id="table"></canvas>
<input id="file" type="file" accept="image/*" hidden>
<pre id="tests"></pre>
<script>
/* =========================================================================
   The table.

   Both this page and the projector are the same origin, so they share
   IndexedDB. The map is stored once, here; the projector is told only
   its id and fetches the blob itself. A 15 MB image never crosses the
   channel.
   ========================================================================= */
/* Storage lives in assets/fog.js, because the projector page opens the
   same database and one definition of the schema is the point. */
const FOG_ALPHA = 0.78;          /* EDITOR_FOG_ALPHA in dnd_map.py */
const ZMIN = 0.02, ZMAX = 40;

const state = { mapId:null, img:null, proxy:null, w:0, h:0, rotation:0, strokes:[],
                view:{z:1,tx:0,ty:0} };
let mask = document.createElement("canvas");

function say(msg){ document.getElementById("said").textContent = msg || ""; }

/* The context is asked for once, with alpha off. A canvas with an alpha
   channel is blended against the page on every frame; this one covers
   the window and never shows anything through it. The options are only
   honoured on the FIRST getContext of a canvas, which is why every call
   site goes through here rather than asking the canvas itself. */
let ctx2d = null;
function ctx(){
  if(!ctx2d) ctx2d = document.getElementById("table").getContext("2d", {alpha:false});
  return ctx2d;
}

function sizeCanvas(){
  const cv = document.getElementById("table");
  const dpr = window.devicePixelRatio || 1;
  cv.width  = Math.round(cv.clientWidth  * dpr);
  cv.height = Math.round(cv.clientHeight * dpr);
  return cv;
}

/* ── moving, or settled ────────────────────────────────────────────
   While the wheel turns or a pan drags, the frame is thrown away in
   16 ms and resampling 59 megapixels well is wasted on it. `moving`
   picks the proxy; the timer puts the real map back a moment after the
   gesture stops, so what the DM ends up looking at is always sharp. */
let moving = false, settleT = null;
function nudge(){
  moving = true;
  clearTimeout(settleT);
  settleT = setTimeout(function(){ moving = false; requestPaint(); }, Fog.SETTLE_MS);
}

/* The drag in progress, or null: two image-space corners and what letting
   go would do. It is the table's own business — the projector is told
   nothing until the stroke is committed, because a box swimming about the
   players' screen would give away where the DM is thinking of looking. */
let preview = null;

/* Those two corners as a canvas-space box, normalised so a drag up or to
   the left is still positive: a negative width strokes and fills nothing.
   It goes through the same view the map is drawn with, so the outline
   promises exactly the ground the stroke will take. */
function previewBox(v, a, b){
  const p = Fog.imageToCanvas(v, Math.min(a.x, b.x), Math.min(a.y, b.y));
  const q = Fog.imageToCanvas(v, Math.max(a.x, b.x), Math.max(a.y, b.y));
  return { x:p.x, y:p.y, w:q.x - p.x, h:q.y - p.y };
}

/* Worth committing? A bare click is a zero-area rectangle: it paints
   nothing, but it would still take an undo slot, an autosave and a
   channel message. Both sides have to have moved — a rectangle with no
   height is as empty as one with no width. */
function bigEnough(a, b){
  return Math.abs(b.x - a.x) >= 1 && Math.abs(b.y - a.y) >= 1;
}

function redraw(){
  const cv = document.getElementById("table");
  const g = ctx();
  g.setTransform(1,0,0,1,0,0);
  g.fillStyle = "#0b0805";
  g.fillRect(0,0,cv.width,cv.height);

  if(!state.img){
    g.fillStyle = "#6d5a3a";
    g.font = '16px "EB Garamond", Georgia, serif';
    g.textAlign = "center";
    g.fillText(Fog.emptyMessage(), cv.width/2, cv.height/2);
    drawPointer(g, cv);
    return;
  }

  const v = state.view;
  /* The proxy while the view is moving, the real map once it settles.
     The destination is the same either way — a smaller source drawn to
     the same rectangle is simply a coarser picture of it. */
  const src = Fog.sourceFor(moving, state.proxy, state.img);
  g.imageSmoothingQuality = src.quality;
  g.drawImage(src.img, v.tx, v.ty, state.w * v.z, state.h * v.z);

  /* The map is resampled at "high" because it is a picture and the DM
     reads it. The fog is not a picture — it is a two-valued mask, black
     or nothing, and the only place resampling shows at all is the couple
     of pixels along a reveal's edge. "high" costs three to four times
     "low" for that edge, every frame, so it does not get it. */
  g.imageSmoothingQuality = "low";
  g.globalAlpha = FOG_ALPHA;
  g.drawImage(mask, v.tx, v.ty, state.w * v.z, state.h * v.z);
  g.globalAlpha = 1;

  /* The rectangle as it is being dragged, shown as the result rather than
     as an outline around it: a reveal redraws the map inside the box with
     no fog over it, a hide lays another coat on. The DM sees the finished
     stroke before letting go, which is the whole point — a rectangle used
     to be committed sight unseen. The outline stays as well, because a
     reveal over already-clear ground would otherwise be invisible. */
  if(preview){
    const b = previewBox(v, preview.a, preview.b);
    if(b.w >= 1 && b.h >= 1){
      const dpr = window.devicePixelRatio || 1;
      g.save();
      g.beginPath(); g.rect(b.x, b.y, b.w, b.h); g.clip();
      if(preview.reveal){
        g.imageSmoothingQuality = "high";
        g.drawImage(state.img, v.tx, v.ty, state.w * v.z, state.h * v.z);
      }else{
        /* The same black at the same alpha the mask is drawn with, so a
           hide previews as the fog it will actually become. */
        g.globalAlpha = FOG_ALPHA;
        g.fillStyle = "#000";
        g.fillRect(b.x, b.y, b.w, b.h);
      }
      g.restore();

      g.save();
      g.setLineDash([7 * dpr, 5 * dpr]);
      g.lineWidth = Math.max(1, Math.round(dpr));
      g.strokeStyle = preview.reveal ? "#e8d9b8" : "#8d7a5b";
      g.strokeRect(b.x, b.y, b.w, b.h);
      g.restore();
    }
  }

  drawPointer(g, cv);
}

/* ── the laser ─────────────────────────────────────────────────────
   Hold Space and the dot follows the pointer, here and on the
   projector; click while holding and a ring is dropped where the
   click landed. Neither is a stroke: nothing goes into the undo
   stack, nothing is saved, nothing appears in a `sync`. The map is
   not changed by pointing at it.

   The position is kept in IMAGE space, like everything else that
   crosses the channel — the two windows are different sizes, and a
   dot in canvas pixels would land somewhere else on the projector.
   The SIZE is canvas pixels, because a laser is a fixed dot on the
   wall and one measured in map space would swell as the DM zoomed. */
let laser = null;              /* {x,y} in image space, or null */
const pings = [];              /* {x,y,t0} in image space */

function drawPointer(g, cv){
  const dpr = window.devicePixelRatio || 1;
  const v = state.view;
  const now = performance.now();
  for(let i = pings.length - 1; i >= 0; i--){
    const p = pings[i], c = Fog.imageToCanvas(v, p.x, p.y);
    if(!Fog.drawPing(g, c.x, c.y, now - p.t0, dpr)) pings.splice(i, 1);
  }
  if(laser){
    const c = Fog.imageToCanvas(v, laser.x, laser.y);
    Fog.drawLaser(g, c.x, c.y, dpr);
  }
}

/* A ping has to be redrawn on frames nothing else asks for — it is an
   animation, not a response to an event. The loop runs only while one
   is alive, and stops the moment the list empties. */
let ringing = false;
function animatePings(){
  if(ringing) return;
  ringing = true;
  (function step(){
    if(!pings.length){ ringing = false; requestPaint(); return; }
    requestPaint();
    requestAnimationFrame(step);
  })();
}

/* Every handler asks for a paint; none of them paints. A wheel notch, a
   pan sample and a drag sample all arrive faster than the screen
   refreshes, and painting inside each of them queued work the frame
   could never drain — which is what the table being unsmooth actually
   was, rather than any one drawing being slow. */
const requestPaint = Fog.coalesce(requestAnimationFrame, redraw);

function remask(){
  if(state.w && state.h) Fog.rasterise(state.strokes, state.w, state.h, mask);
  requestPaint();
}

/* Build the proxy for whatever the map currently is.

   Generation-counted, exactly as the projector counts its decodes: two
   rotates in quick succession leave two of these in flight, and if the
   first finishes last the table ends up drawing a proxy that is a
   quarter-turn out of step with the map every time the view moves. The
   loser is released rather than dropped, or the counter would leak the
   very bitmaps release() exists to reclaim. */
let proxyGen = 0;
async function setProxy(){
  const gen = ++proxyGen;
  const p = await Fog.makeProxy(state.img, state.w, state.h);
  if(gen !== proxyGen){ Fog.release(p); return; }
  state.proxy = p;
}

/* Swap in a stored map: decode it, fit it, and pick its fog back up. */
async function loadMapRecord(rec){
  const raw = await createImageBitmap(rec.blob);
  const f = await Fog.getFog(rec.id);
  state.mapId = rec.id;
  state.rotation = (f && f.rotation) || 0;
  state.strokes = (f && f.strokes) || [];
  /* Bring the picture to the orientation the saved strokes assume. */
  const turned = Fog.rotateImage(raw, state.rotation);
  /* Whatever this map replaces is hundreds of megabytes; let go of it
     here rather than waiting for a collector that may arrive after the
     renderer has run out of room. `turned` is `raw` itself when there is
     no rotation, which is why the two are compared before releasing. */
  if(turned !== raw) Fog.release(raw);
  /* Nulled, not merely released: drawing a closed bitmap throws, and a
     frame can land between here and the new proxy arriving. */
  Fog.release(state.img); state.proxy = Fog.release(state.proxy);
  state.img = turned;
  state.w = state.img.width; state.h = state.img.height;
  /* Built off the map that was just decoded. Awaited rather than left to
     arrive later: the first thing the DM does with a new map is zoom it,
     and a proxy that turns up afterwards helps nobody. */
  await setProxy();
  const cv = sizeCanvas();
  state.view = Fog.fitView(state.w, state.h, cv.width, cv.height);
  stack.strokes = state.strokes; stack.undone.length = 0;
  try{ localStorage.setItem(LAST_KEY, rec.id); }catch(e){}
  remask();
  say(rec.name);
  /* syncPayload, not a bare map id: this also runs when the table reloads
     and restores the last map from localStorage, and a screen that is
     already open must pick up the restored fog and rotation, not be
     wiped back to a blank slate. */
  send(syncPayload(state));
}

/* No decode here: nothing ever read a stored width or height back, and
   loadMapRecord decodes anyway. A file that will not decode still rejects
   in there, inside this same try. */
async function chooseMap(file){
  try{
    const id = "m" + Date.now().toString(36);
    await Fog.putMap(id, file.name, file);
    await loadMapRecord({id:id, name:file.name, blob:file});
  }catch(e){
    say("Could not read " + file.name + " — " + e.message);
  }
}

/* ── pan and zoom ──────────────────────────────────────────────────── */
function wireView(){
  const cv = document.getElementById("table");

  cv.addEventListener("wheel", function(e){
    if(!state.img) return;
    e.preventDefault();
    const dpr = window.devicePixelRatio || 1;
    /* From the distance actually scrolled, not a fixed step per event.
       A trackpad sends a stream of small deltas and a fixed step turned
       a flick into sixteen-fold zoom and a repaint at every stop along
       the way. */
    const f = Fog.wheelFactor(e.deltaY, e.deltaMode, cv.height);
    state.view = Fog.zoomAt(state.view, e.offsetX*dpr, e.offsetY*dpr, f, ZMIN, ZMAX);
    nudge();
    requestPaint();
    sendView();
  }, {passive:false});

  /* Right-drag pans, as dnd_map.py does, leaving the left button for paint. */
  let panning = false, lx = 0, ly = 0;
  cv.addEventListener("contextmenu", e => e.preventDefault());
  cv.addEventListener("pointerdown", function(e){
    if(e.button !== 2) return;
    panning = true; lx = e.clientX; ly = e.clientY; cv.setPointerCapture(e.pointerId);
  });
  cv.addEventListener("pointermove", function(e){
    if(!panning) return;
    const dpr = window.devicePixelRatio || 1;
    state.view.tx += (e.clientX - lx) * dpr;
    state.view.ty += (e.clientY - ly) * dpr;
    lx = e.clientX; ly = e.clientY;
    nudge();
    requestPaint();
    sendView();
  });
  cv.addEventListener("pointerup", function(){ panning = false; });
  /* A lost pointer capture must not leave panning stuck true. */
  cv.addEventListener("pointercancel", function(){ panning = false; });

  window.addEventListener("resize", function(){
    sizeCanvas();
    requestPaint();
    sendView();
  });
}

function wire(){
  const file = document.getElementById("file");
  document.getElementById("open-map").addEventListener("click", () => file.click());
  file.addEventListener("change", function(){
    if(file.files && file.files[0]) chooseMap(file.files[0]);
    file.value = "";
  });
  wireView();

  const pick = (onId, offId, set) => {
    const on = document.getElementById(onId), off = document.getElementById(offId);
    on.addEventListener("click", function(){ set(); on.classList.add("on"); off.classList.remove("on"); });
  };
  pick("a-reveal", "a-hide", () => reveal = true);
  pick("a-hide", "a-reveal", () => reveal = false);
  document.getElementById("all-reveal").addEventListener("click", () => pushStroke(Fog.fill(true)));
  document.getElementById("all-fog").addEventListener("click", () => pushStroke(Fog.fill(false)));
  document.getElementById("rotate").addEventListener("click", rotate);
  document.getElementById("undo").addEventListener("click", undo);
  document.getElementById("redo").addEventListener("click", redo);
  document.addEventListener("keydown", function(e){
    /* Space is the laser, held. A toggle would be a mode to forget you
       are in, and forgetting it means a left-drag that pings the table
       instead of lifting fog. Held, there is nothing to forget.
       preventDefault because Space also re-presses whatever toolbar
       button was last clicked. */
    if(e.code === "Space" && !e.ctrlKey && !e.metaKey && !e.altKey){
      e.preventDefault();
      if(!e.repeat) setLaser(true);
      return;
    }
    if(!(e.ctrlKey || e.metaKey)) return;
    if(e.key === "z"){ e.preventDefault(); undo(); }
    if(e.key === "y"){ e.preventDefault(); redo(); }
  });
  document.addEventListener("keyup", function(e){
    if(e.code === "Space") setLaser(false);
  });
  /* Alt-tabbing away with Space down never delivers the keyup, and the
     dot would be left burning on the projector. */
  window.addEventListener("blur", function(){ setLaser(false); });
  wirePaint();

  document.getElementById("open-screen").addEventListener("click", function(){
    const w = window.open("map-screen.html", "waterdeep-map-screen",
      "popup=yes,width=1280,height=800,left=" + (screen.availWidth) + ",top=0");
    /* A blocked popup returns null and says nothing else. */
    say(w ? "Players' screen opened — drag it to the projector."
          : "The players' screen was blocked — allow pop-ups for this site.");
  });
}

/* ── the stroke stack ──────────────────────────────────────────────
   Kept as three tiny pure functions so the suite can exercise the
   ordering rules without a canvas or a map. */
function applyPush(st, stroke){ st.strokes.push(stroke); st.undone.length = 0; return true; }
function applyUndo(st){
  if(!st.strokes.length) return false;
  st.undone.push(st.strokes.pop()); return true;
}
function applyRedo(st){
  if(!st.undone.length) return false;
  st.strokes.push(st.undone.pop()); return true;
}

const LAST_KEY = "waterdeep-table.last";
const stack = { strokes: state.strokes, undone: [] };
/* Left-drag is always a rectangle. The brush was here too, and it was
   the wrong instrument for the job: fog is lifted street by street and a
   freehand smear neither follows a street nor lands the same twice.
   Reveal/Hide is the only choice left, which is why there is no longer a
   tool button to press. Fog painted by the old brush is still `path`
   strokes in IndexedDB, and Fog.rasterise still draws them. */
let reveal = true;

let saveT = null;
function saveFog(){
  if(!state.mapId) return;
  clearTimeout(saveT);
  saveT = setTimeout(() => { Fog.putFog(state.mapId, state.strokes, state.rotation).catch(()=>{}); }, 400);
}

/* ── the channel ───────────────────────────────────────────────────
   Only small things travel: a view, a stroke, a map id. The map blob
   stays in IndexedDB, which the projector reads directly. */

/* Everything a screen needs to draw the table as it currently stands.
   The map is an id, not an image — that is what keeps this small.
   Rotation must be here: the stored blob is always the original, and
   the strokes travel already rotated, so a screen that decodes the
   blob unturned lands the fog crooked.

   The framing travels as an image-space RECTANGLE, never as {z,tx,ty}.
   Those numbers are in this canvas's device pixels; the projector's
   canvas is another size at another devicePixelRatio, so applied
   verbatim they crop the map and every pan carries the error along.
   The canvas is read at send time because it is the sender's dimensions
   that turn a view into a rectangle.

   And what is sent is the part of that rectangle which is MAP. This
   window is wider than the map is, so fitting the map to it leaves
   empty table either side; sent whole, the projector frames the
   emptiness too and the map ends up small in the middle of it. Rotate
   made it obvious because rotate is the one action that fits the whole
   map, and so carries the widest margins. */
function syncPayload(s, canvas){
  const cv = canvas || document.getElementById("table");
  return { t:"sync", mapId:s.mapId,
           rect:Fog.clampRect(Fog.viewRect(s.view, cv.width, cv.height), s.w, s.h),
           strokes:s.strokes, rotation:s.rotation };
}

const ch = Fog.open(function(m){
  /* The only thing the table listens for is a screen announcing itself. */
  if(m.t === "hello") ch.postMessage(syncPayload(state));
});

let send = function(m){ if(ch) ch.postMessage(m); };

/* The view changes on every wheel tick and every pan frame, so it is
   sent at most once per frame rather than per event. */
let viewPending = false;
function sendView(){
  if(!ch || viewPending) return;
  viewPending = true;
  requestAnimationFrame(function(){
    viewPending = false;
    const cv = document.getElementById("table");
    send({t:"view", rect:Fog.clampRect(Fog.viewRect(state.view, cv.width, cv.height),
                                       state.w, state.h)});
  });
}

/* The dot moves with the pointer, so it is sent at most once per frame,
   for the same reason the view is: a 125 Hz mouse would otherwise post
   125 messages a second at the projector. */
let laserPending = false;
function sendLaser(){
  if(!ch || laserPending || !laser) return;
  laserPending = true;
  requestAnimationFrame(function(){
    laserPending = false;
    if(laser) send({t:"laser", x:laser.x, y:laser.y});
  });
}

/* Space down and Space up, and anything else that has to end the dot —
   the window losing focus, most of all, since alt-tabbing with Space
   held never delivers a keyup and would leave it burning on the
   projector. `held` is separate from `laser` because the key can be
   held before the pointer has ever been over the map, and there is
   nowhere to draw a dot until it has. */
let held = false, pointerAt = null;
function setLaser(on){
  if(on === held) return;
  held = on;
  const cv = document.getElementById("table");
  cv.style.cursor = on ? "none" : "crosshair";
  if(on){
    laser = pointerAt;
    if(laser) send({t:"laser", x:laser.x, y:laser.y});
  }else{
    laser = null;
    send({t:"laser", off:true});
  }
  requestPaint();
}

function pushStroke(s){
  applyPush(stack, s);
  state.strokes = stack.strokes;
  /* Just this stroke onto the mask as it stands, rather than replaying
     the list, which is O(n²) over a session's worth of strokes on a mask
     that may be twenty-four megapixels. Undo, redo, sync, rotate and map
     loading still replay from zero — that is what the spec's O(n)
     rasterise is for, and none of them happen mid-drag. */
  if(state.w && state.h) Fog.applyStroke(s, state.w, state.h, mask);
  requestPaint(); saveFog();
  send({t:"stroke", stroke:s});
}

function undo(){
  if(!applyUndo(stack)) return;
  state.strokes = stack.strokes; remask(); saveFog();
  send({t:"undo", strokes:state.strokes});
}
function redo(){
  if(!applyRedo(stack)) return;
  state.strokes = stack.strokes; remask(); saveFog();
  send({t:"undo", strokes:state.strokes});
}

/* ── painting ──────────────────────────────────────────────────────
   A drag is ONE stroke, decided on pointerup: two corners and an action.
   Nothing goes on the mask, into the undo stack or across the channel
   while the pointer is down — the drag is drawn as a preview on this
   canvas only, and the projector hears about the rectangle once, when
   the DM lets go. That keeps a drag out of the players' sight and keeps
   an undo meaning one rectangle. */
function wirePaint(){
  const cv = document.getElementById("table");
  let drawing = false, start = null;

  const at = (x, y) => {
    const dpr = window.devicePixelRatio || 1;
    const r = cv.getBoundingClientRect();
    return Fog.canvasToImage(state.view, (x - r.left) * dpr, (y - r.top) * dpr);
  };

  /* Ending a drag from anywhere: the preview goes, and the canvas is
     asked for the frame that no longer has it. */
  function stop(){
    drawing = false; start = null; preview = null;
    requestPaint();
  }

  cv.addEventListener("pointerdown", function(e){
    if(e.button !== 0 || !state.img) return;
    /* Space held means the pointer is a laser, and a laser does not lift
       fog. The click drops a ring instead — on both windows, from one
       message, so the players see the ring the DM is looking at. */
    if(held){
      const p = at(e.clientX, e.clientY);
      pings.push({x:p.x, y:p.y, t0:performance.now()});
      send({t:"ping", x:p.x, y:p.y});
      animatePings();
      return;
    }
    drawing = true; cv.setPointerCapture(e.pointerId);
    start = at(e.clientX, e.clientY);
    preview = { a:start, b:start, reveal:reveal };
  });

  cv.addEventListener("pointermove", function(e){
    /* Tracked whether or not a button is down: Space can be pressed
       while the pointer is simply resting over the map, and the dot has
       to appear where it already is rather than on the next twitch. */
    if(state.img) pointerAt = at(e.clientX, e.clientY);
    if(held){
      laser = pointerAt;
      sendLaser();
      requestPaint();
      return;
    }
    if(!drawing || !start) return;
    /* Only the corner the pointer is at — the samples the browser
       buffered between frames say nothing a rectangle needs. One repaint
       per frame, not one per event, or a 125 Hz mouse queues 125 full
       redraws a second and the drag stutters. */
    preview = { a:start, b:at(e.clientX, e.clientY), reveal:reveal };
    requestPaint();
  });

  cv.addEventListener("pointerup", function(e){
    if(!drawing || !start) return;
    const p = at(e.clientX, e.clientY);
    /* A click paints nothing, so it must not cost an undo, a save and a
       message. Only a box with both sides to it is committed. */
    if(bigEnough(start, p)) pushStroke(Fog.rect(start.x, start.y, p.x, p.y, reveal));
    stop();
  });

  /* A lost pointer capture (e.g. the OS steals the gesture) must not
     strand a preview on the canvas or commit a rectangle the DM never
     finished drawing. */
  cv.addEventListener("pointercancel", function(){
    if(!drawing) return;
    stop();
  });

  /* The pointer leaving the map would otherwise strand the dot against
     whichever edge it left by — on the projector as well, where it would
     sit there while the DM is reading a book. */
  cv.addEventListener("pointerleave", function(){
    pointerAt = null;
    if(!held || !laser) return;
    laser = null;
    send({t:"laser", off:true});
    requestPaint();
  });
}

async function rotate(){
  if(!state.img) return;
  const oldH = state.h, was = state.img;
  state.img = Fog.rotateImage(state.img, 1);
  Fog.release(was);
  state.w = state.img.width; state.h = state.img.height;
  /* The proxy is a picture of the map and the map has just turned. Drop
     it first so a frame between here and the new one cannot draw the
     old orientation, then build the replacement. */
  state.proxy = Fog.release(state.proxy);
  state.rotation = (state.rotation + 1) % 4;
  /* The dot and any rings are in the coordinates the map had a moment
     ago, and there is no sensible way to carry a laser through a
     quarter-turn — the DM's hand has not moved. Drop them; the next
     twitch of the pointer puts the dot back where it belongs. */
  pings.length = 0;
  if(laser){ laser = null; send({t:"laser", off:true}); }
  state.strokes = Fog.rotateStrokes(state.strokes, oldH);
  stack.strokes = state.strokes; stack.undone.length = 0;
  const c = sizeCanvas();
  state.view = Fog.fitView(state.w, state.h, c.width, c.height);
  remask(); saveFog();
  send(syncPayload(state));
  await setProxy();
  requestPaint();
}

/* =========================================================================
   Self-tests:  map-table.html?test=1
   ========================================================================= */
function runTests(){
  /* #bar is fixed and opaque over the first lines of the report, and
     #table is fixed over all of it and swallows the wheel so the report
     cannot even be scrolled. Neither is any use while the suite runs.
     The canvas keeps its width/height attributes while hidden, which is
     what the payload tests measure against. */
  document.getElementById("bar").style.display = "none";
  document.getElementById("table").style.display = "none";

  const out=[]; let pass=0, fail=0;
  const ok=(name,cond,extra)=>{ if(cond){pass++; out.push("PASS  "+name);} else {fail++; out.push("FAIL  "+name+(extra?"\n      "+extra:""));} };
  const near=(a,b)=>Math.abs(a-b)<0.001;

  /* alpha of the mask at a pixel: 255 = fogged, 0 = revealed */
  const alphaAt=(cv,x,y)=>cv.getContext("2d").getImageData(x,y,1,1).data[3];

  /* ── view maths ────────────────────────────────────────────────── */
  const v = {z:2, tx:30, ty:-10};
  const c = Fog.imageToCanvas(v, 100, 50);
  ok("image to canvas", near(c.x, 230) && near(c.y, 90), JSON.stringify(c));
  const i = Fog.canvasToImage(v, c.x, c.y);
  ok("round trip", near(i.x, 100) && near(i.y, 50), JSON.stringify(i));

  ok("fit scale takes the tighter axis", near(Fog.fitScale(1000, 500, 500, 500), 0.5),
     String(Fog.fitScale(1000,500,500,500)));
  ok("fit scale of nothing is 1", Fog.fitScale(0, 0, 500, 500) === 1);

  const fv = Fog.fitView(1000, 500, 500, 500);
  ok("fit view centres the image", near(fv.tx, 0) && near(fv.ty, 125), JSON.stringify(fv));

  /* ── the framing crosses the channel as an image rectangle ────────
     A view is in the sender's DEVICE pixels. The projector's canvas is
     another size at another devicePixelRatio — a laptop at 150% beside a
     projector at 100% is the ordinary case — so a view applied verbatim
     shows the players a cropped, off-centre map. A rectangle of the map
     means the same thing on any canvas. */
  const vr = Fog.viewRect({z:2, tx:-100, ty:-40}, 800, 600);
  ok("a view names the image rectangle its canvas shows",
     near(vr.x0, 50) && near(vr.y0, 20) && near(vr.x1, 450) && near(vr.y1, 320),
     JSON.stringify(vr));

  const rt = Fog.viewFromRect(vr, 800, 600);
  ok("rect round-trips to the same view on the same canvas",
     near(rt.z, 2) && near(rt.tx, -100) && near(rt.ty, -40), JSON.stringify(rt));

  ok("an empty rectangle is refused rather than dividing by zero",
     Fog.viewFromRect({x0:5,y0:5,x1:5,y1:5}, 800, 600).z === 1);

  /* THE test for the projector bug: the same rectangle, fitted to a
     canvas of a different size and aspect, must still show the same
     ground. Contain-fitting means the tight axis matches exactly and the
     slack axis becomes a centred superset — never a crop. */
  const other = Fog.viewFromRect(vr, 700, 900);
  const shown = Fog.viewRect(other, 700, 900);
  ok("the same rect on a differently-sized canvas frames the same map",
     near(shown.x0, vr.x0) && near(shown.x1, vr.x1) &&
     shown.y0 <= vr.y0 + 0.001 && shown.y1 >= vr.y1 - 0.001 &&
     near((shown.y0 + shown.y1) / 2, (vr.y0 + vr.y1) / 2),
     "sent " + JSON.stringify(vr) + " but the screen would show " + JSON.stringify(shown));
  /* ── only the map is sent, never the table around it ──────────────
     A view is the whole canvas. This window is far wider than a portrait
     map fitted into it, so most of that view is empty table — and the
     projector, told to frame it, put the map small in the middle. It
     showed worst after a rotate, which fits the whole map and so carries
     the widest margins. */
  const wide = Fog.viewRect(Fog.fitView(6800, 8700, 1912, 940), 1912, 940);
  const trimmed = Fog.clampRect(wide, 6800, 8700);
  ok("the margins either side of the map are not sent",
     wide.x0 < -1000 && near(trimmed.x0, 0) && near(trimmed.x1, 6800),
     "sent " + JSON.stringify(wide) + " and should send " + JSON.stringify(trimmed));
  ok("the axis that already fits is left alone",
     near(trimmed.y0, 0) && near(trimmed.y1, 8700), JSON.stringify(trimmed));
  ok("a framing inside the map is untouched",
     JSON.stringify(Fog.clampRect({x0:100,y0:200,x1:900,y1:1200}, 6800, 8700)) ===
     JSON.stringify({x0:100,y0:200,x1:900,y1:1200}));
  ok("a view that has left the map behind is sent as it is",
     Fog.clampRect({x0:-900,y0:-900,x1:-100,y1:-100}, 6800, 8700).x0 === -900,
     "an empty intersection is not a rectangle anyone can frame");
  ok("with no map loaded there is nothing to clamp to",
     Fog.clampRect({x0:-50,y0:-50,x1:50,y1:50}, 0, 0).x0 === -50);

  const clamped = syncPayload({mapId:"m1", view:Fog.fitView(6800, 8700, 1912, 940),
                               w:6800, h:8700, strokes:[], rotation:0},
                              {width:1912, height:940});
  ok("a sync carries the trimmed framing, not the window's",
     near(clamped.rect.x0, 0) && near(clamped.rect.x1, 6800), JSON.stringify(clamped.rect));

  /* The projector shows the framing faithfully. Overscan exists as a
     mechanism — one constant, read by both windows — but it is 1: with
     the margins trimmed out of the rectangle, a tenth of overscan would
     crop the map's own edges rather than empty table. */
  ok("the projector crops nothing the table framed", Fog.SCREEN_ZOOM === 1,
     "SCREEN_ZOOM is " + Fog.SCREEN_ZOOM + " — anything above 1 loses the map's edges");

  const over = Fog.viewFromRect(vr, 800, 600, 1.1);
  const oShown = Fog.viewRect(over, 800, 600);
  ok("the mechanism still tightens when it is asked to",
     near((oShown.x1 - oShown.x0) * 1.1, vr.x1 - vr.x0) &&
     near((oShown.y1 - oShown.y0) * 1.1, vr.y1 - vr.y0),
     JSON.stringify(oShown));
  ok("a tightened fit keeps the same ground centred",
     near((oShown.x0 + oShown.x1) / 2, (vr.x0 + vr.x1) / 2) &&
     near((oShown.y0 + oShown.y1) / 2, (vr.y0 + vr.y1) / 2),
     "zooming about a corner would drift the map off the projector");
  ok("no zoom means the plain contain-fit",
     near(Fog.viewFromRect(vr, 800, 600).z, Fog.viewFromRect(vr, 800, 600, 1).z));

  const z = Fog.zoomAt({z:1,tx:0,ty:0}, 200, 100, 2, 0.05, 40);
  ok("zoom holds the cursor still",
     near(Fog.canvasToImage(z,200,100).x, 200) && near(Fog.canvasToImage(z,200,100).y, 100),
     JSON.stringify(z));
  ok("zoom clamps to max", Fog.zoomAt({z:30,tx:0,ty:0}, 0, 0, 4, 0.05, 40).z === 40);
  ok("zoom clamps to min", Fog.zoomAt({z:0.1,tx:0,ty:0}, 0, 0, 0.1, 0.05, 40).z === 0.05);

  /* ── the mask ──────────────────────────────────────────────────── */
  const blank = Fog.rasterise([], 40, 40);
  ok("no strokes means all fog", alphaAt(blank, 20, 20) === 255, String(alphaAt(blank,20,20)));

  const revealed = Fog.rasterise([Fog.fill(true)], 40, 40);
  ok("fill reveals everything", alphaAt(revealed, 20, 20) === 0);

  const box = Fog.rasterise([Fog.rect(10,10,30,30,true)], 40, 40);
  ok("rect reveals inside", alphaAt(box, 20, 20) === 0);
  ok("rect leaves outside fogged", alphaAt(box, 2, 2) === 255);

  const back = Fog.rasterise([Fog.fill(true), Fog.rect(10,10,30,30,false)], 40, 40);
  ok("a later stroke wins", alphaAt(back, 20, 20) === 255 && alphaAt(back, 2, 2) === 0);

  const dot = Fog.rasterise([Fog.line(20,20,20,20,6,true)], 40, 40);
  ok("a click leaves a dot", alphaAt(dot, 20, 20) === 0, "zero-length line must still paint");

  const drag = Fog.rasterise([Fog.line(5,20,35,20,4,true)], 40, 40);
  ok("a drag reveals along its path", alphaAt(drag, 20, 20) === 0 && alphaAt(drag, 20, 2) === 255);

  const undone = Fog.rasterise([Fog.fill(true), Fog.rect(10,10,30,30,false)].slice(0,-1), 40, 40);
  ok("dropping the last stroke undoes it", alphaAt(undone, 20, 20) === 0);

  /* Appending one stroke to the mask must equal replaying the lot. That
     equality is the whole licence for the brush to stop being O(n²). */
  const many = [Fog.fill(true), Fog.rect(5,5,25,25,false),
                Fog.line(10,30,30,30,4,true), Fog.line(20,20,20,20,7,false)];
  const together = Fog.rasterise(many, 40, 40);
  const oneAtATime = Fog.rasterise([], 40, 40);
  many.forEach(s => Fog.applyStroke(s, 40, 40, oneAtATime));
  const pixels = cv => cv.getContext("2d").getImageData(0, 0, 40, 40).data;
  const a = pixels(together), b = pixels(oneAtATime);
  let same = a.length === b.length;
  for(let k = 0; same && k < a.length; k++) if(a[k] !== b[k]) same = false;
  ok("applying strokes one at a time matches rasterising them together", same,
     "an appended mask and a replayed mask must be identical, pixel for pixel");

  /* ── rotation ──────────────────────────────────────────────────── */
  /* 90° clockwise on an image 100 tall: (x,y) -> (oldH - y, x) */
  const rot = Fog.rotateStrokes([Fog.line(10, 20, 30, 40, 5, true)], 100);
  ok("rotate maps a line's ends", rot[0].x0 === 80 && rot[0].y0 === 10 && rot[0].x1 === 60 && rot[0].y1 === 30,
     JSON.stringify(rot[0]));
  ok("rotate keeps the radius and the action", rot[0].r === 5 && rot[0].reveal === true);
  ok("rotate leaves a fill alone", Fog.rotateStrokes([Fog.fill(true)], 100)[0].k === "fill");

  const small = document.createElement("canvas"); small.width = 20; small.height = 60;
  ok("rotating an image swaps its sides",
     Fog.rotateImage(small, 1).width === 60 && Fog.rotateImage(small, 1).height === 20);
  ok("two turns keep the shape",
     Fog.rotateImage(small, 2).width === 20 && Fog.rotateImage(small, 2).height === 60);
  ok("no turns returns the original", Fog.rotateImage(small, 0) === small);

  ok("an empty table says so", Fog.emptyMessage() === "No map on the table", Fog.emptyMessage());

  /* ── where a fetched effect is kept ───────────────────────────────
     The spell effects pack is 1.09 GB and the repository carries 35 of
     it. Anything else is fetched once and kept, so the second cast
     works with the router unplugged. It goes in the same database as
     the maps, because both pages open that one and a second database
     is a second schema to keep in step. */
  ok("the store has somewhere to put a fetched effect",
     typeof Fog.putFx === "function" && typeof Fog.getFx === "function");
  ok("the database version leaves room for it", Fog.DB_VERSION === 2,
     "adding a store needs a version, or the upgrade never runs");

  /* ── the catalogue ────────────────────────────────────────────────
     376 effects the DM has to find one of, mid-combat, without
     scrolling. The index is a few kilobytes of paths; these are the
     rules that turn it into an answer. */
  ok("the pack is pinned to a commit, not to a moving branch",
     /^[0-9a-f]{40}$/.test(SpellFx.PACK_COMMIT), SpellFx.PACK_COMMIT);

  ok("a shape is read from the pack's own naming",
     SpellFx.shapeOf("fire_ball_RAY_02.webm") === "ray" &&
     SpellFx.shapeOf("frost_CONE_01.webm") === "cone" &&
     SpellFx.shapeOf("fire_explosion_CIRCLE_01.webm") === "circle" &&
     SpellFx.shapeOf("earth-hole_RECTANGLE_01.webm") === "rectangle" &&
     SpellFx.shapeOf("smoke_pillar_SQUARE_01.webm") === "square");
  ok("a file with no marker claims no shape",
     SpellFx.shapeOf("shockwave_01_transcentre.webm") === "" &&
     SpellFx.shapeOf("arrow_straight_01.webm") === "",
     "guessing a footprint the animator did not draw for is worse than admitting none");
  ok("CIRCLE inside a word is not a shape",
     SpellFx.shapeOf("semicircleish_01.webm") === "");

  const FX = [
    {path:"fire/fire_ball_RAY_02.webm", name:"fire ball 02", category:"fire", shape:"ray", bundled:false},
    {path:"fire/fire_explosion_CIRCLE_01.webm", name:"fire explosion 01", category:"fire", shape:"circle", bundled:true},
    {path:"ice/frost_CONE_01.webm", name:"frost 01", category:"ice", shape:"cone", bundled:true}
  ];
  ok("an empty search is the whole catalogue", SpellFx.search(FX, "").length === 3);
  ok("a search matches the name", SpellFx.search(FX, "explosion").length === 1);
  ok("a search matches the category",
     SpellFx.search(FX, "fire").length === 2 && SpellFx.search(FX, "ice").length === 1);
  ok("a search matches the shape", SpellFx.search(FX, "cone")[0].path === "ice/frost_CONE_01.webm");
  ok("search ignores case and stray spaces", SpellFx.search(FX, "  FROST ").length === 1);
  ok("every word has to match",
     SpellFx.search(FX, "fire cone").length === 0 && SpellFx.search(FX, "fire circle").length === 1,
     "two words narrow the list; they do not widen it");
  ok("what is in the repo is offered first",
     SpellFx.search(FX, "")[0].bundled === true &&
     SpellFx.search(FX, "").filter(e => !e.bundled).length === 1,
     "an effect that needs the network should not be the first thing under the cursor");

  ok("a bundled effect is read from this site",
     SpellFx.urlFor(FX[1]) === "assets/spell-effects/fire/fire_explosion_CIRCLE_01.webm");
  ok("anything else comes from the pinned commit",
     SpellFx.urlFor(FX[0]) ===
       "https://cdn.jsdelivr.net/gh/jackkerouac/animated-spell-effects@" +
       SpellFx.PACK_COMMIT + "/spell-effects/fire/fire_ball_RAY_02.webm",
     SpellFx.urlFor(FX[0]));

  const stack = {strokes:[], undone:[]};
  applyPush(stack, Fog.fill(true));
  applyPush(stack, Fog.rect(0,0,5,5,false));
  ok("pushing keeps order", stack.strokes.length === 2 && stack.strokes[1].k === "rect");
  applyUndo(stack);
  ok("undo pops the last", stack.strokes.length === 1 && stack.undone.length === 1);
  applyRedo(stack);
  ok("redo puts it back", stack.strokes.length === 2 && stack.undone.length === 0);
  applyUndo(stack); applyPush(stack, Fog.fill(false));
  ok("a new stroke drops the redo trail", stack.undone.length === 0 && stack.strokes.length === 2);
  ok("undo on an empty stack is not a crash", applyUndo({strokes:[],undone:[]}) === false);

  /* ── the channel payload ──────────────────────────────────────────── */
  const tcv = document.getElementById("table");
  const fake = {mapId:"m1", view:{z:2,tx:3,ty:4}, strokes:[Fog.fill(true)], rotation:3};
  const payload = syncPayload(fake, tcv);
  const want = Fog.viewRect(fake.view, tcv.width, tcv.height);
  ok("sync carries the map", payload.mapId === "m1", JSON.stringify(payload));
  ok("sync carries the framing as an image rectangle",
     payload.rect && near(payload.rect.x0, want.x0) && near(payload.rect.y0, want.y0) &&
     near(payload.rect.x1, want.x1) && near(payload.rect.y1, want.y1),
     JSON.stringify(payload.rect));
  ok("sync sends no device-pixel view", payload.view === undefined,
     "z/tx/ty belong to the sender's canvas; the screen must fit the rect to its own");
  ok("sync carries every stroke", payload.strokes.length === 1 && payload.strokes[0].k === "fill");
  ok("sync carries the rotation", payload.rotation === 3,
     "without it the screen decodes the blob unturned and the fog lands crooked");
  ok("sync survives the channel", JSON.parse(JSON.stringify(payload)).strokes[0].reveal === true,
     "the payload must be structured-clonable");

  /* ── the mask is capped, so a frame costs a screen and not a map ──
     Drawing a full-resolution mask over the map was the whole cost of a
     frame: 40–60 ms for a 6.5 megapixel map, against 4 ms for the map
     itself. The strokes stay in image space; only the raster they are
     drawn into is capped. */
  const dims = Fog.maskDims(1780, 3628);
  ok("a big mask is capped on its long side", dims.w === 1005 && dims.h === 2048,
     JSON.stringify(dims));
  ok("the cap carries the scale that keeps strokes image-space",
     near(dims.s, 2048 / 3628), String(dims.s));
  ok("a map smaller than the cap is not blown up",
     Fog.maskDims(40, 40).s === 1 && Fog.maskDims(40, 40).w === 40);

  const capped = Fog.rasterise([Fog.rect(100, 100, 900, 900, true)], 1780, 3628);
  ok("a capped mask is raster-sized, not map-sized",
     capped.width === 1005 && capped.height === 2048, capped.width + "x" + capped.height);
  ok("a stroke still lands where image space says it should",
     alphaAt(capped, Math.round(500 * dims.s), Math.round(500 * dims.s)) === 0 &&
     alphaAt(capped, Math.round(1400 * dims.s), Math.round(1400 * dims.s)) === 255,
     "the cap must scale the drawing, not the coordinates");

  /* ── paths, which the table no longer draws ───────────────────────
     The brush is gone from the toolbar, but every fog saved while it was
     there is a list of `path` strokes sitting in IndexedDB, and they are
     replayed on every load, sync and rotate. These cases are what keeps
     those maps opening as they were left. */
  const dotP = Fog.rasterise([Fog.path([20, 20], 6, true)], 40, 40);
  ok("a path of one point leaves a dot", alphaAt(dotP, 20, 20) === 0,
     "a click is a path that never grew");

  const dragP = Fog.rasterise([Fog.path([5, 20, 20, 20, 35, 20], 4, true)], 40, 40);
  ok("a path reveals along every segment",
     alphaAt(dragP, 20, 20) === 0 && alphaAt(dragP, 33, 20) === 0 && alphaAt(dragP, 20, 2) === 255);

  /* The live drag draws only what has just been added. If that ever
     stopped matching a replay, the projector and the table would drift
     apart over a long stroke and only a reload would show it. */
  const grown = Fog.path([5, 20], 4, true);
  const live = Fog.rasterise([], 40, 40);
  Fog.applyStroke(grown, 40, 40, live);
  grown.pts.push(20, 20);
  Fog.applyStroke(grown, 40, 40, live, 0);
  grown.pts.push(35, 20);
  Fog.applyStroke(grown, 40, 40, live, 1);
  const whole = Fog.rasterise([grown], 40, 40);
  const g1 = pixels(live), g2 = pixels(whole);
  let grownSame = g1.length === g2.length;
  for(let k = 0; grownSame && k < g1.length; k++) if(g1[k] !== g2[k]) grownSame = false;
  ok("a path grown a tail at a time matches replaying it whole", grownSame,
     "the tail must start at the last point already drawn, or the joins gap");

  const rotP = Fog.rotateStrokes([Fog.path([10, 20, 30, 40], 5, true)], 100)[0];
  ok("rotate maps every point of a path",
     rotP.k === "path" && rotP.pts[0] === 80 && rotP.pts[1] === 10 &&
     rotP.pts[2] === 60 && rotP.pts[3] === 30, JSON.stringify(rotP));

  /* ── the wheel ────────────────────────────────────────────────────
     A fixed factor per event was the whole of "zooming is laggy". One
     notch of a wheel mouse is one event and looked fine; a trackpad
     sends twenty small ones for the same flick, and 1.15 twenty times
     over is sixteen-fold — into the clamp, repainting all the way. The
     factor has to come from the distance scrolled. */
  ok("a wheel notch zooms about as much as it used to",
     Fog.wheelFactor(-100, 0, 800) > 1.14 && Fog.wheelFactor(-100, 0, 800) < 1.18,
     String(Fog.wheelFactor(-100, 0, 800)));
  ok("scrolling the other way zooms out by the same amount",
     near(Fog.wheelFactor(100, 0, 800) * Fog.wheelFactor(-100, 0, 800), 1),
     "in and straight back out must land where it started");
  ok("no movement is no zoom", Fog.wheelFactor(0, 0, 800) === 1);
  ok("twenty small deltas equal one big one",
     near(Math.pow(Fog.wheelFactor(-5, 0, 800), 20), Fog.wheelFactor(-100, 0, 800)),
     "a trackpad and a wheel must reach the same place for the same flick");
  ok("a line is about sixteen pixels",
     near(Fog.wheelFactor(-3, 1, 800), Fog.wheelFactor(-48, 0, 800)));
  ok("a page is the viewport",
     near(Fog.wheelFactor(-1, 2, 640), Fog.wheelFactor(-640, 0, 800)));
  ok("one absurd delta cannot swallow the map",
     Fog.wheelFactor(-100000, 0, 800) <= 1.5 && Fog.wheelFactor(100000, 0, 800) >= 1/1.5,
     String(Fog.wheelFactor(-100000, 0, 800)));

  /* ── the proxy ────────────────────────────────────────────────────
     Resampling 59 megapixels well costs about 6 ms a frame, which is
     affordable at rest and is not affordable while the wheel turns. */
  const pd = Fog.proxyDims(6800, 8700);
  ok("a big map is capped for moving", pd.w === 1601 && pd.h === 2048, JSON.stringify(pd));
  ok("a small map needs no proxy at all", Fog.proxyDims(300, 200).s === 1);

  /* A decoded map is hundreds of megabytes and both pages replace one
     every time a map is loaded or turned. Waiting for a collector is
     how a renderer runs out of room mid-session. */
  let closed = 0;
  ok("releasing a decoded picture closes it", (function(){
     const fake = { close(){ closed++; } };
     return Fog.release(fake) === null && closed === 1;
  })());
  ok("releasing a canvas, or nothing at all, is not a crash",
     Fog.release(document.createElement("canvas")) === null &&
     Fog.release(null) === null && Fog.release(undefined) === null,
     "rotateImage hands back a canvas, which has no close()");

  ok("while moving, the proxy and the cheap resampling",
     Fog.sourceFor(true, "proxy", "map").img === "proxy" &&
     Fog.sourceFor(true, "proxy", "map").quality === "low");
  ok("at rest, the map itself at full quality",
     Fog.sourceFor(false, "proxy", "map").img === "map" &&
     Fog.sourceFor(false, "proxy", "map").quality === "high");
  ok("a map too small to have a proxy still moves cheaply",
     Fog.sourceFor(true, null, "map").img === "map" &&
     Fog.sourceFor(true, null, "map").quality === "low",
     "there is nothing to swap in, but the resampling can still be dropped");

  /* ── the ping ─────────────────────────────────────────────────────
     The ring a click drops under the laser. It expands and fades, and
     then it is gone — both windows draw it from this one function so
     the DM and the players are watching the same ring. */
  const p0 = Fog.pingAt(0), pMid = Fog.pingAt(Fog.PING_LIFE / 2);
  ok("a ring starts small and opaque", p0.alpha === 1 && p0.r > 0, JSON.stringify(p0));
  ok("it grows and fades", pMid.r > p0.r && pMid.alpha < p0.alpha, JSON.stringify(pMid));
  ok("it eases out rather than growing evenly", pMid.r > (p0.r + Fog.pingAt(Fog.PING_LIFE - 1).r) / 2,
     "a ring that expands linearly reads as a circle, not as something struck");
  ok("it is over when it is over", Fog.pingAt(Fog.PING_LIFE) === null &&
     Fog.pingAt(Fog.PING_LIFE + 50) === null);
  ok("a ring from the future is not drawn", Fog.pingAt(-1) === null);

  const pc = document.createElement("canvas"); pc.width = pc.height = 40;
  const pg = pc.getContext("2d");
  ok("drawing a live ring reports it alive", Fog.drawPing(pg, 20, 20, 10, 1) === true);
  ok("drawing a dead ring reports it dead, which is how it is dropped",
     Fog.drawPing(pg, 20, 20, Fog.PING_LIFE + 1, 1) === false);
  ok("the laser leaves the context as it found it", (function(){
     pg.globalAlpha = 0.5; Fog.drawLaser(pg, 20, 20, 1); return pg.globalAlpha === 0.5;
  })(), "save/restore, or the next thing drawn inherits the dot's fill");

  /* ── the rectangle's preview ──────────────────────────────────────
     A rectangle used to be invisible until it was committed: the DM let
     go and then found out what had been revealed. The box is drawn while
     the drag is live, which means turning two image-space points into a
     canvas-space box — through the same view the map is drawn with, or
     the outline sits somewhere other than the ground it promises. */
  const pv = {z:2, tx:30, ty:-10};
  const pb = previewBox(pv, {x:10, y:20}, {x:60, y:70});
  ok("the preview box follows the view",
     near(pb.x, 50) && near(pb.y, 30) && near(pb.w, 100) && near(pb.h, 100),
     JSON.stringify(pb));

  const back2 = previewBox(pv, {x:60, y:70}, {x:10, y:20});
  ok("a drag up and to the left previews the same box",
     near(back2.x, pb.x) && near(back2.y, pb.y) &&
     near(back2.w, pb.w) && near(back2.h, pb.h),
     "a negative width draws nothing, so the corners are normalised first");

  /* With the brush gone, a bare click is no longer a dot — it is a
     zero-area rectangle. Committing one would spend an undo slot, an
     autosave and a channel message on a stroke that paints nothing. */
  ok("a click is not a rectangle", bigEnough({x:10,y:10}, {x:10.5,y:10.5}) === false);
  ok("a real drag is", bigEnough({x:10,y:10}, {x:40,y:12}) === true);
  ok("a drag along one axis only is not a rectangle",
     bigEnough({x:10,y:10}, {x:40,y:10}) === false,
     "no height means fillRect paints nothing");

  /* ── one paint per frame ──────────────────────────────────────────
     redraw() used to run inside every wheel tick and every pointermove.
     A 125 Hz mouse asked for 125 full repaints a second; at 50 ms each
     the queue never drained, which is what "not smooth" actually was. */
  let painted = 0; const queued = [];
  const askPaint = Fog.coalesce(fn => queued.push(fn), () => painted++);
  askPaint(); askPaint(); askPaint();
  ok("many requests inside one frame schedule one paint",
     queued.length === 1 && painted === 0, queued.length + " scheduled, " + painted + " painted");
  queued.shift()();
  ok("the paint happens when the frame comes", painted === 1);
  askPaint();
  ok("the frame after that can be scheduled again", queued.length === 1);

  const el=document.getElementById("tests");
  el.style.display="block";
  el.textContent = "Map Table self-tests\n"+"=".repeat(46)+"\n"+out.join("\n")+
    "\n"+"=".repeat(46)+"\n"+pass+" passed, "+fail+" failed\n";
  document.title = (fail? "FAIL " : "PASS ")+pass+"/"+(pass+fail)+" — Map Table tests";
}

/* =========================================================================
   Frame cost:  map-table.html?bench=1

   The suite proves the fog is right; this says what a frame costs, which
   is the other thing that has to hold. It runs against whatever map the
   table last had, or a synthetic one the size of the Waterdeep map.

   Canvas 2D queues work for the GPU, so timing a loop of draws measures
   almost nothing unless something forces it through. A one-pixel
   getImageData does — but ONE PER BATCH, not one per draw. Per draw it
   charges every row a full pipeline stall, and it charged them so
   heavily that this page reported the fog as the cost of a frame and
   the map as cheap. Measured properly it is the other way round, which
   is why the proxy exists and why the mask does not need to shrink.
   ========================================================================= */
async function runBench(){
  const cv = sizeCanvas();
  const g = ctx();
  const flush = () => g.getImageData(0, 0, 1, 1);
  const ms = (fn, n) => { fn(); flush();
    const t = performance.now();
    for(let i = 0; i < n; i++) fn();
    flush();
    return +((performance.now() - t) / n).toFixed(2); };

  if(!state.img){
    const c = document.createElement("canvas");
    c.width = 1780; c.height = 3628;
    const cg = c.getContext("2d");
    cg.fillStyle = "#4a3b28"; cg.fillRect(0, 0, c.width, c.height);
    state.img = await createImageBitmap(c);
    state.w = c.width; state.h = c.height;
    await setProxy();
    state.view = Fog.fitView(state.w, state.h, cv.width, cv.height);
    state.strokes = []; stack.strokes = state.strokes;
  }

  /* A map's worth of painting, so the mask is not trivially empty. */
  const drag = Fog.path([], 40, true);
  for(let i = 0; i < 400; i++) drag.pts.push((i * 137) % state.w, (i * 271) % state.h);
  state.strokes = [drag]; stack.strokes = state.strokes;

  const d = Fog.maskDims(state.w, state.h);
  const rows = [];
  const line = (name, v, note) => rows.push(("  " + name).padEnd(34) + String(v).padStart(8) +
    (note ? "   " + note : ""));

  rows.push("map            " + state.w + "×" + state.h +
            "   (" + (state.w * state.h / 1e6).toFixed(1) + " MP)");
  rows.push("mask           " + d.w + "×" + d.h +
            "   (" + (d.w * d.h / 1e6).toFixed(1) + " MP, cap " + Fog.maskDims(9e9, 1).w + ")");
  rows.push("proxy          " + (state.proxy ? state.proxy.width + "×" + state.proxy.height +
            "   (" + (state.proxy.width * state.proxy.height / 1e6).toFixed(1) + " MP)"
            : "none — the map is already under the cap"));
  rows.push("canvas         " + cv.width + "×" + cv.height + "   dpr " + (window.devicePixelRatio || 1));
  rows.push("");

  const v = state.view;
  Fog.rasterise(state.strokes, state.w, state.h, mask);
  line("clear", ms(() => { g.setTransform(1,0,0,1,0,0); g.fillStyle = "#0b0805";
                           g.fillRect(0, 0, cv.width, cv.height); }, 20));
  /* The same resampling qualities redraw() uses, or the two lines below
     would not add up to the frame beneath them. */
  line("draw the map", ms(() => { g.setTransform(1,0,0,1,0,0); g.imageSmoothingQuality = "high";
       g.drawImage(state.img, v.tx, v.ty, state.w * v.z, state.h * v.z); }, 20),
       "the expensive half, and the reason for the proxy");
  line("draw the proxy", state.proxy
       ? ms(() => { g.setTransform(1,0,0,1,0,0); g.imageSmoothingQuality = "low";
           g.drawImage(state.proxy, v.tx, v.ty, state.w * v.z, state.h * v.z); }, 20)
       : "n/a", state.proxy ? "what a frame draws while the wheel turns" : "map is under the cap");
  line("draw the fog", ms(() => { g.setTransform(1,0,0,1,0,0); g.imageSmoothingQuality = "low";
       g.globalAlpha = FOG_ALPHA;
       g.drawImage(mask, v.tx, v.ty, state.w * v.z, state.h * v.z); g.globalAlpha = 1; }, 20),
       "cheap — the old figure was a measurement artefact");
  line("the fog at \"high\"", ms(() => { g.setTransform(1,0,0,1,0,0); g.imageSmoothingQuality = "high";
       g.globalAlpha = FOG_ALPHA;
       g.drawImage(mask, v.tx, v.ty, state.w * v.z, state.h * v.z); g.globalAlpha = 1; }, 20),
       "what resampling a mask well would cost");
  moving = false;
  const frame = ms(redraw, 20);
  line("a whole frame, at rest", frame, frame < 16.7 ? "under one refresh at 60 Hz" : "OVER a 60 Hz refresh");
  moving = true;
  const mframe = ms(redraw, 20);
  moving = false;
  line("a whole frame, moving", mframe,
       mframe < 16.7 ? "under one refresh at 60 Hz" : "OVER a 60 Hz refresh");
  rows.push("");
  line("rasterise 400 points", ms(() => Fog.rasterise(state.strokes, state.w, state.h, mask), 10),
       "undo, reload, rotate");
  const tail = Fog.path([100, 100, 140, 140], 40, true);
  line("one drag tail", ms(() => Fog.applyStroke(tail, state.w, state.h, mask, 0), 20),
       "per frame while painting");

  const el = document.getElementById("tests");
  el.style.display = "block";
  el.textContent = "Map Table frame cost\n" + "=".repeat(60) + "\n" +
    rows.join("\n") + "\n" + "=".repeat(60) +
    "\nEvery figure is milliseconds, forced through with getImageData.\n" +
    "A frame has 16.7 ms at 60 Hz, and the fog used to take 40–60 of them.\n";
  document.title = frame.toFixed(1) + " ms/frame — Map Table";
}

(async function boot(){
  if(/[?&]test=1/.test(location.search)){ runTests(); return; }
  if(/[?&]bench=1/.test(location.search)){
    wire();
    let id = null; try{ id = localStorage.getItem(LAST_KEY); }catch(e){}
    if(id){ const rec = await Fog.getMap(id).catch(() => null); if(rec) await loadMapRecord(rec); }
    await runBench();
    return;
  }
  sizeCanvas();
  wire();
  if(!ch) say("This browser cannot link the two windows — the players' screen will not follow.");
  try{ await Fog.openDb(); }
  catch(e){
    say("This browser will not open its map store here — serve the site over http, not file://");
  }
  let last = null; try{ last = localStorage.getItem(LAST_KEY); }catch(e){}
  if(last){
    const rec = await Fog.getMap(last).catch(() => null);
    /* loadMapRecord decodes and reads the fog store, and either can
       reject. This path runs at the start of every session, so an
       unguarded throw aborts boot before redraw() and leaves the DM a
       blank page with no toolbar feedback. The spec asks for the failure
       to be named, with the file name. */
    if(rec){
      try{ await loadMapRecord(rec); }
      catch(e){ say("Could not read " + rec.name + " — " + e.message); }
    }
  }
  redraw();
})();
</script>
