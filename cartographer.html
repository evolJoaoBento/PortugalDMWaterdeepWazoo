<style>
/* ═══════════════════════════════════════════════════════════════════
   The chart owns the window.

   Live from the moment the page is — no veil, no click to wake it —
   and the page cannot scroll, so a wheel over the chart can only mean
   zoom. There is nothing underneath to run away.

   The chart is also full-bleed, and that is not only for the look.
   The iframe is cross-origin: when a drag starts inside it, Leaflet
   binds its mouseup to *that* document. Release the button over our
   page instead and the iframe never hears it, so the map goes on
   panning. We cannot end that drag from out here — contentDocument is
   walled off, synthetic events are refused, and aidedd listens for no
   postMessage. What we can do is remove the places to let go: every
   pixel under the bar is chart, and the vellum border, the title and
   the credit are overlays that let the pointer straight through.
   ═══════════════════════════════════════════════════════════════════ */
html,body{height:100%}
body{
  height:100vh;height:100dvh;
  display:flex;flex-direction:column;
  overflow:hidden;overscroll-behavior:none;
}
.parade{flex:0 0 auto}

/* ═══ THE TABLE — every pixel below the bar is chart ══════════════ */
.table{
  flex:1 1 auto;min-height:0;position:relative;
  background:#e8dcc0;
}
.table iframe{
  position:absolute;inset:0;
  width:100%;height:100%;border:0;display:block;
}

/* Everything below floats over the chart and passes clicks through, so
   none of it is a place where a drag can be lost. */
.table .overlay{position:absolute;pointer-events:none;z-index:2}

/* the vellum edge of the chart, drawn on top of it */
.chart-edge{
  inset:0;
  box-shadow:
    inset 0 0 0 1px rgba(107,84,39,.9),
    inset 0 0 0 9px rgba(233,220,192,.55),
    inset 0 0 0 10px rgba(107,84,39,.75),
    inset 0 0 60px rgba(90,68,26,.22);
}
.chart-edge .pin{
  position:absolute;width:11px;height:11px;border-radius:50%;
  background:radial-gradient(circle at 34% 30%,#e8cd83,#8a6a24 70%);
  box-shadow:0 1px 3px rgba(0,0,0,.5);
}
.chart-edge .pin.tl{top:4px;left:4px}
.chart-edge .pin.tr{top:4px;right:4px}
.chart-edge .pin.bl{bottom:4px;left:4px}
.chart-edge .pin.br{bottom:4px;right:4px}

/* aidedd owns three corners of its own map — its panel top-left, the
   coordinate readout top-right, the zoom and minimap along the bottom.
   Our furniture takes the free lanes down the middle. */
.chart-plate{
  top:20px;left:50%;transform:translateX(-50%);
  max-width:min(46ch,54vw);text-align:center;
  padding:12px 22px 13px;
  background:linear-gradient(160deg,rgba(247,240,219,.94),rgba(226,210,172,.90));
  border:1px solid rgba(107,84,39,.65);
  box-shadow:0 10px 26px rgba(60,44,18,.34);
}
.chart-plate h1{
  font-family:"Cinzel",serif;font-weight:700;
  font-size:clamp(17px,2.4vw,26px);letter-spacing:.05em;margin:0;color:#2f2513;
}
.chart-plate p{
  margin:7px 0 0;font-style:italic;font-size:15px;color:#5c4b30;
}

/* the credit — only its links take the pointer */
.chart-credit{
  left:50%;transform:translateX(-50%);bottom:14px;
  display:flex;flex-wrap:wrap;gap:2px 16px;align-items:baseline;justify-content:center;
  margin:0;padding:6px 16px;
  font-size:13px;color:#4a3c24;white-space:nowrap;
  background:linear-gradient(160deg,rgba(247,240,219,.90),rgba(226,210,172,.86));
  border:1px solid rgba(107,84,39,.55);
  box-shadow:0 6px 18px rgba(60,44,18,.28);
}
.chart-credit a{pointer-events:auto;color:#6d5216}
.chart-credit .out{
  font-family:"Cinzel",serif;font-size:10px;letter-spacing:.16em;text-transform:uppercase;
  text-decoration:none;border-bottom:1px solid rgba(109,82,22,.5);padding-bottom:2px;
}

/* aidedd puts its own panel top-left and its zoom controls bottom-right,
   so on narrow screens our furniture stands down rather than fight it */
@media(max-width:820px){
  /* transform:none matters — the centring translate from the base rule
     would otherwise drag these back off their edges */
  .chart-plate{top:10px;left:50%;transform:translateX(-50%);padding:8px 13px 9px;max-width:82vw}
  .chart-plate p{display:none}
  .chart-credit{bottom:8px;font-size:11px;padding:5px 12px;white-space:normal;text-align:center}
  .parade{padding-bottom:14px}
  .parade .inner{padding-top:12px;gap:10px}
}
@media(max-height:560px){
  .chart-plate,.chart-credit{display:none}
}
</style>
