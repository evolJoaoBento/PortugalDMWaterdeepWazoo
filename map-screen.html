<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="wazoo-build" content="20260813d">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>The Map &mdash; Waterdeep</title>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500&display=swap" rel="stylesheet">
<style>
html,body{height:100%}
/* No cursor by default: a parked arrow on a projector is chrome the
   players should never see. It comes back while the mouse is actually
   moving — see the timer below — because a DM who drags the pointer
   across this window otherwise loses it entirely. */
body{margin:0;background:#000;overflow:hidden;cursor:none}
body.pointing{cursor:default}
#screen{position:fixed;inset:0;width:100%;height:100%;display:block}
</style>
<script src="assets/fog.js?v=20260813d"></script>
</head>
<body>
<canvas id="screen"></canvas>
<script>
/* =========================================================================
   The players' screen.

   Draws what the table tells it to and nothing else: no toolbar, no
   cursor, no chrome. Fog here is fully opaque — the 0.78 wash on the
   DM's page exists so the DM can see through it, and that would be a
   spoiler on a projector.

   The map is never sent over the channel. This page is the same origin
   as the table, so it opens the same IndexedDB and fetches the blob by
   id itself.
   ========================================================================= */
/* Storage comes from assets/fog.js — the table writes the map, this page
   reads it, and the schema is written once so the two cannot drift. */
/* `rect` is the framing as the table sent it — in image space — and it is
   the thing kept, not `view`. A view is in the sender's device pixels and
   this canvas is another size at another devicePixelRatio, so the view is
   derived from the rect against THIS canvas, and re-derived whenever the
   canvas changes size. */
const st = { img:null, proxy:null, w:0, h:0, strokes:[], rect:null,
             view:{z:1,tx:0,ty:0}, waiting:true };
let mask = document.createElement("canvas");

/* Asked for once, with alpha off: this canvas covers the projector and
   nothing is ever seen through it, so there is no reason to blend it
   against the page every frame. Only the first getContext of a canvas
   honours the options, hence the single call site. */
let ctx2d = null;
function ctx(){
  if(!ctx2d) ctx2d = document.getElementById("screen").getContext("2d", {alpha:false});
  return ctx2d;
}

function sizeCanvas(){
  const cv = document.getElementById("screen");
  const dpr = window.devicePixelRatio || 1;
  cv.width = Math.round(cv.clientWidth * dpr);
  cv.height = Math.round(cv.clientHeight * dpr);
  return cv;
}

/* The DM's wheel arrives here as a stream of `view` messages, and this
   window has the same 59-megapixel map to resample. Same rule as the
   table: the proxy while the framing is moving, the real map once it
   has been still for a moment. The players are looking at the sharp
   one — nobody reads a map mid-zoom. */
let moving = false, settleT = null;
function nudge(){
  moving = true;
  clearTimeout(settleT);
  settleT = setTimeout(function(){ moving = false; requestPaint(); }, Fog.SETTLE_MS);
}

/* Where the DM is pointing, in image space, and the rings they have
   dropped. Never stored, never part of the fog. */
let laser = null;
const pings = [];
let ringing = false;
function animatePings(){
  if(ringing) return;
  ringing = true;
  (function step(){
    if(!pings.length){ ringing = false; requestPaint(); return; }
    requestPaint();
    requestAnimationFrame(step);
  })();
}

/* These lines exist so a dark projector can be told from fog and from a
   bug, which means they have to be legible across a room. #3a3128 on
   black is about 1.6:1 — it was not. This is the DM page's #6d5a3a, and
   the size is scaled because the canvas is measured in device pixels, so
   a bare 18 is about nine CSS pixels on a 2× display. */
function note(g, cv, text){
  const dpr = window.devicePixelRatio || 1;
  g.fillStyle = "#6d5a3a";
  g.font = Math.round(18 * dpr) + 'px "EB Garamond", Georgia, serif';
  g.textAlign = "center";
  g.fillText(text, cv.width/2, cv.height/2);
}

function redraw(){
  const cv = document.getElementById("screen");
  const g = ctx();
  g.setTransform(1,0,0,1,0,0);
  g.fillStyle = "#000";
  g.fillRect(0,0,cv.width,cv.height);

  if(!st.img){
    /* A black rectangle is indistinguishable from fog, from a bug, and
       from a dead cable. Say which it is. */
    note(g, cv, st.waiting ? "Waiting for the table…" : Fog.emptyMessage());
    return;
  }
  const v = st.view;
  const src = Fog.sourceFor(moving, st.proxy, st.img);
  g.imageSmoothingQuality = src.quality;
  g.drawImage(src.img, v.tx, v.ty, st.w * v.z, st.h * v.z);
  /* The map gets "high" at rest; the fog is a two-valued mask and
     resampling it well costs three to four times as much for an edge
     nobody can see across a room. The table does the same, so the two
     agree. */
  g.imageSmoothingQuality = "low";
  g.drawImage(mask, v.tx, v.ty, st.w * v.z, st.h * v.z);   /* fully opaque */

  /* The DM's pointer goes on top of the fog: they point at things they
     are about to reveal as often as at things already shown. */
  const dpr = window.devicePixelRatio || 1, now = performance.now();
  for(let i = pings.length - 1; i >= 0; i--){
    const p = pings[i], c = Fog.imageToCanvas(v, p.x, p.y);
    if(!Fog.drawPing(g, c.x, c.y, now - p.t0, dpr)) pings.splice(i, 1);
  }
  if(laser){
    const c = Fog.imageToCanvas(v, laser.x, laser.y);
    Fog.drawLaser(g, c.x, c.y, dpr);
  }
}

/* One paint per frame however many messages arrive. A pan sends one
   message per frame and a finished stroke sends another, and painting
   inside each would repaint the projector twice for the same frame. */
const requestPaint = Fog.coalesce(requestAnimationFrame, redraw);

function remask(){
  if(st.w && st.h) Fog.rasterise(st.strokes, st.w, st.h, mask);
  requestPaint();
}

/* The table sends the image-space rectangle it is showing, never its own
   {z,tx,ty}: those are its device pixels, and this canvas is another size
   at another devicePixelRatio. Fitting the rectangle here is what makes
   the two windows frame the same ground rather than the projector showing
   a crop. The rect is kept so a resize can be re-fitted.

   The rectangle is the MAP the table is showing, trimmed of the empty
   window around it, so fitting it fills this screen as far as the map's
   own shape allows. Fog.SCREEN_ZOOM would tighten that further and is 1:
   with the margins already gone, tightening would crop the map itself. */
function applyRect(r){
  if(!r) return;
  st.rect = r;
  const cv = document.getElementById("screen");
  st.view = Fog.viewFromRect(r, cv.width, cv.height, Fog.SCREEN_ZOOM);
}

/* The stored blob is always the original. The table sends how many
   quarter-turns it is currently showing, and the strokes arrive already
   rotated — so the picture has to be turned to match, or the fog sits
   crooked over it.

   Two syncs close together — a rotate double-click — start two decodes
   that can finish out of order, leaving the image at one rotation and the
   strokes at another. Nothing repairs that: `stroke` and `view` never
   touch st.img, so the fog stays crooked until the next sync. Hence the
   generation counter: a call that is no longer the latest assigns
   nothing, whether it succeeded or failed. */
let mapGen = 0;
async function showMap(id, rotation){
  const gen = ++mapGen;
  const rec = await Fog.getMap(id).catch(() => null);
  if(gen !== mapGen) return;
  if(!rec){ st.img = Fog.release(st.img); st.proxy = Fog.release(st.proxy);
            st.w = 0; st.h = 0; st.waiting = false; redraw(); return; }

  let raw;
  try{ raw = await createImageBitmap(rec.blob); }
  catch(e){
    /* A blob that will not decode must not leave a live screen sitting on
       "Waiting for the table…" while the table is plainly working — the
       strokes have already been replaced by now, so there is no going
       back to what was showing. Say there is no map. */
    if(gen !== mapGen) return;
    st.img = Fog.release(st.img); st.proxy = Fog.release(st.proxy);
    st.w = 0; st.h = 0; st.waiting = false; redraw(); return;
  }
  if(gen !== mapGen) return;

  const turned = Fog.rotateImage(raw, rotation || 0);
  /* This page decodes the map again on EVERY sync — a rotate is a sync —
     and each decode of a 6800×8700 blob is about 236 MB. Three of them
     alive at once is enough to wedge the renderer, and a wedged renderer
     on a projector is a black screen in front of the players. Let go of
     the last one here. */
  if(turned !== raw) Fog.release(raw);
  Fog.release(st.img); Fog.release(st.proxy);
  st.img = turned;
  st.w = st.img.width; st.h = st.img.height;
  st.proxy = null;
  remask();
  /* The proxy is built after the first paint rather than before it: the
     players should see the map as soon as it decodes, and the proxy is
     only wanted once the DM starts moving the framing. The generation
     check applies here too — a second sync must not fit an old proxy to
     a new map. */
  const p = await Fog.makeProxy(st.img, st.w, st.h);
  if(gen !== mapGen) return;
  st.proxy = p;
}

const ch = Fog.open(async function(m){
  st.waiting = false;
  /* `sync` is the whole state and is sent both on request and whenever
     the geometry changes under the screen, e.g. a rotate. */
  if(m.t === "sync"){
    st.strokes = m.strokes || [];
    /* A sync can mean the map has turned, and a dot or a ring drawn in
       the old orientation would land on the wrong room. The table drops
       its own at the same moment. */
    pings.length = 0; laser = null;
    applyRect(m.rect);
    if(m.mapId) await showMap(m.mapId, m.rotation);
    else { mapGen++; Fog.release(st.img); Fog.release(st.proxy);
           st.img = null; st.proxy = null; st.w = 0; st.h = 0; redraw(); }
    return;
  }
  if(m.t === "view"){ applyRect(m.rect); nudge(); requestPaint(); return; }
  /* The dot and the ring. Both are drawn and then forgotten: they never
     touch the mask, the strokes or the store. A ring is stamped when it
     ARRIVES rather than carrying the table's clock, so the two windows
     cannot disagree about how old it is. */
  if(m.t === "laser"){
    laser = m.off ? null : {x:m.x, y:m.y};
    requestPaint();
    return;
  }
  if(m.t === "ping"){
    pings.push({x:m.x, y:m.y, t0:performance.now()});
    animatePings();
    return;
  }
  if(m.t === "stroke"){
    st.strokes.push(m.stroke);
    /* One stroke onto the mask, not a replay of every stroke so far. */
    if(st.w && st.h) Fog.applyStroke(m.stroke, st.w, st.h, mask);
    requestPaint();
    return;
  }
  /* There was an `extend` message here, carrying the tail of a brush drag
     in progress. The brush is gone from the table, so nothing sends one;
     a rectangle is a single stroke, decided on pointerup. Fog saved by
     the old brush is still full of `path` strokes and still arrives in
     `sync` — Fog.rasterise draws those exactly as before. */
  if(m.t === "undo"){ st.strokes = m.strokes || []; remask(); return; }
});

function hello(){ if(ch) ch.postMessage({t:"hello"}); }

/* The cursor, while it is moving and for a moment after.

   This window hides the pointer so the players never see an arrow
   parked on the map. That also means a DM whose mouse strays onto this
   monitor cannot find it — the pointer is simply gone. Showing it while
   it moves costs the players nothing: nobody is moving a mouse over the
   projector except the DM, and it fades again a second and a half after
   they stop. */
const CURSOR_LINGER = 1500;
let cursorT = null;
window.addEventListener("pointermove", function(){
  document.body.classList.add("pointing");
  clearTimeout(cursorT);
  cursorT = setTimeout(function(){ document.body.classList.remove("pointing"); }, CURSOR_LINGER);
});

sizeCanvas();
/* Re-fit the last rectangle the table sent. Keeping the old view would
   leave the projector framed for a window size it no longer has. */
window.addEventListener("resize", function(){
  const cv = sizeCanvas();
  if(st.rect) st.view = Fog.viewFromRect(st.rect, cv.width, cv.height, Fog.SCREEN_ZOOM);
  requestPaint();
});
/* A projector window opened late, or reloaded when someone kicks the
   cable, must catch up — otherwise it shows an empty map while the
   table shows half the city, and that looks like a broken tool. */
document.addEventListener("visibilitychange", function(){ if(!document.hidden) hello(); });

if(!ch){
  const cv = document.getElementById("screen");
  note(cv.getContext("2d"), cv, "This browser cannot link the two windows");
} else {
  redraw();
  hello();
}
</script>
</body>
</html>
