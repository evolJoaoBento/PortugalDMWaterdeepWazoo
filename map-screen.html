<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="wazoo-build" content="20260813a">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>The Map &mdash; Waterdeep</title>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500&display=swap" rel="stylesheet">
<style>
html,body{height:100%}
body{margin:0;background:#000;overflow:hidden;cursor:none}
#screen{position:fixed;inset:0;width:100%;height:100%;display:block}
</style>
<script src="assets/fog.js?v=20260813a"></script>
</head>
<body>
<canvas id="screen"></canvas>
<script>
/* =========================================================================
   The players' screen.

   Draws what the table tells it to and nothing else: no toolbar, no
   cursor, no chrome. Fog here is fully opaque — the 0.78 wash on the
   DM's page exists so the DM can see through it, and that would be a
   spoiler on a projector.

   The map is never sent over the channel. This page is the same origin
   as the table, so it opens the same IndexedDB and fetches the blob by
   id itself.
   ========================================================================= */
/* Storage comes from assets/fog.js — the table writes the map, this page
   reads it, and the schema is written once so the two cannot drift. */
/* `rect` is the framing as the table sent it — in image space — and it is
   the thing kept, not `view`. A view is in the sender's device pixels and
   this canvas is another size at another devicePixelRatio, so the view is
   derived from the rect against THIS canvas, and re-derived whenever the
   canvas changes size. */
const st = { img:null, w:0, h:0, strokes:[], rect:null, view:{z:1,tx:0,ty:0}, waiting:true };
let mask = document.createElement("canvas");

function sizeCanvas(){
  const cv = document.getElementById("screen");
  const dpr = window.devicePixelRatio || 1;
  cv.width = Math.round(cv.clientWidth * dpr);
  cv.height = Math.round(cv.clientHeight * dpr);
  return cv;
}

/* These lines exist so a dark projector can be told from fog and from a
   bug, which means they have to be legible across a room. #3a3128 on
   black is about 1.6:1 — it was not. This is the DM page's #6d5a3a, and
   the size is scaled because the canvas is measured in device pixels, so
   a bare 18 is about nine CSS pixels on a 2× display. */
function note(g, cv, text){
  const dpr = window.devicePixelRatio || 1;
  g.fillStyle = "#6d5a3a";
  g.font = Math.round(18 * dpr) + 'px "EB Garamond", Georgia, serif';
  g.textAlign = "center";
  g.fillText(text, cv.width/2, cv.height/2);
}

function redraw(){
  const cv = document.getElementById("screen");
  const g = cv.getContext("2d");
  g.setTransform(1,0,0,1,0,0);
  g.fillStyle = "#000";
  g.fillRect(0,0,cv.width,cv.height);

  if(!st.img){
    /* A black rectangle is indistinguishable from fog, from a bug, and
       from a dead cable. Say which it is. */
    note(g, cv, st.waiting ? "Waiting for the table…" : Fog.emptyMessage());
    return;
  }
  const v = st.view;
  g.imageSmoothingQuality = "high";
  g.drawImage(st.img, v.tx, v.ty, st.w * v.z, st.h * v.z);
  /* The map gets "high"; the fog is a two-valued mask and resampling it
     well costs three to four times as much for an edge nobody can see
     across a room. The table does the same, so the two agree. */
  g.imageSmoothingQuality = "low";
  g.drawImage(mask, v.tx, v.ty, st.w * v.z, st.h * v.z);   /* fully opaque */
}

/* One paint per frame however many messages arrive. A brush drag sends a
   message per frame and a pan sends one per frame, but they are separate
   messages and painting inside each would repaint the projector twice for
   the same frame. */
const requestPaint = Fog.coalesce(requestAnimationFrame, redraw);

function remask(){
  if(st.w && st.h) Fog.rasterise(st.strokes, st.w, st.h, mask);
  requestPaint();
}

/* The table sends the image-space rectangle it is showing, never its own
   {z,tx,ty}: those are its device pixels, and this canvas is another size
   at another devicePixelRatio. Fitting the rectangle here is what makes
   the two windows frame the same ground rather than the projector showing
   a crop. The rect is kept so a resize can be re-fitted. */
function applyRect(r){
  if(!r) return;
  st.rect = r;
  const cv = document.getElementById("screen");
  st.view = Fog.viewFromRect(r, cv.width, cv.height);
}

/* The stored blob is always the original. The table sends how many
   quarter-turns it is currently showing, and the strokes arrive already
   rotated — so the picture has to be turned to match, or the fog sits
   crooked over it.

   Two syncs close together — a rotate double-click — start two decodes
   that can finish out of order, leaving the image at one rotation and the
   strokes at another. Nothing repairs that: `stroke` and `view` never
   touch st.img, so the fog stays crooked until the next sync. Hence the
   generation counter: a call that is no longer the latest assigns
   nothing, whether it succeeded or failed. */
let mapGen = 0;
async function showMap(id, rotation){
  const gen = ++mapGen;
  const rec = await Fog.getMap(id).catch(() => null);
  if(gen !== mapGen) return;
  if(!rec){ st.img = null; st.w = 0; st.h = 0; st.waiting = false; redraw(); return; }

  let raw;
  try{ raw = await createImageBitmap(rec.blob); }
  catch(e){
    /* A blob that will not decode must not leave a live screen sitting on
       "Waiting for the table…" while the table is plainly working — the
       strokes have already been replaced by now, so there is no going
       back to what was showing. Say there is no map. */
    if(gen !== mapGen) return;
    st.img = null; st.w = 0; st.h = 0; st.waiting = false; redraw(); return;
  }
  if(gen !== mapGen) return;

  st.img = Fog.rotateImage(raw, rotation || 0);
  st.w = st.img.width; st.h = st.img.height;
  remask();
}

const ch = Fog.open(async function(m){
  st.waiting = false;
  /* `sync` is the whole state and is sent both on request and whenever
     the geometry changes under the screen, e.g. a rotate. */
  if(m.t === "sync"){
    st.strokes = m.strokes || [];
    applyRect(m.rect);
    if(m.mapId) await showMap(m.mapId, m.rotation);
    else { mapGen++; st.img = null; st.w = 0; st.h = 0; redraw(); }
    return;
  }
  if(m.t === "view"){ applyRect(m.rect); requestPaint(); return; }
  if(m.t === "stroke"){
    st.strokes.push(m.stroke);
    /* One stroke onto the mask, not a replay of every stroke so far. */
    if(st.w && st.h) Fog.applyStroke(m.stroke, st.w, st.h, mask);
    requestPaint();
    return;
  }
  /* The tail of the drag in progress: the points the DM's pointer has
     added since the last frame. They are appended to the stroke already
     in the list — the same object the table is growing — and only the new
     segments are drawn, starting at the last point already on this mask
     so the join does not gap. */
  if(m.t === "extend"){
    const s = st.strokes[st.strokes.length - 1];
    if(!s || s.k !== "path" || !m.pts || !m.pts.length) return;
    const drawn = (s.pts.length >> 1) - 1;
    for(let i = 0; i < m.pts.length; i++) s.pts.push(m.pts[i]);
    if(st.w && st.h) Fog.applyStroke(s, st.w, st.h, mask, drawn);
    requestPaint();
    return;
  }
  if(m.t === "undo"){ st.strokes = m.strokes || []; remask(); return; }
});

function hello(){ if(ch) ch.postMessage({t:"hello"}); }

sizeCanvas();
/* Re-fit the last rectangle the table sent. Keeping the old view would
   leave the projector framed for a window size it no longer has. */
window.addEventListener("resize", function(){
  const cv = sizeCanvas();
  if(st.rect) st.view = Fog.viewFromRect(st.rect, cv.width, cv.height);
  requestPaint();
});
/* A projector window opened late, or reloaded when someone kicks the
   cable, must catch up — otherwise it shows an empty map while the
   table shows half the city, and that looks like a broken tool. */
document.addEventListener("visibilitychange", function(){ if(!document.hidden) hello(); });

if(!ch){
  const cv = document.getElementById("screen");
  note(cv.getContext("2d"), cv, "This browser cannot link the two windows");
} else {
  redraw();
  hello();
}
</script>
</body>
</html>
